<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Human Capital Development Group</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body data-i18n-title="title.contact">

    <header>
        <div class="container">
            <div class="logo">
                <img src="images/logo.png" alt="Human Capital Development Group" class="logo-img" />
            </div>
            <nav>
                <ul class="nav-links" id="nav-links">
                    <li><a href="./home.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="./about.html" data-i18n="nav.about">About</a></li>
                    <li><a href="./services.html" data-i18n="nav.services">Services</a></li>
                    <li><a href="./contact.html" class="active" data-i18n="nav.contact">Contact</a></li>
                    <li><button id="lang-toggle" class="lang-toggle">ქართული</button></li>
                </ul>
                <button class="hamburger" aria-label="Toggle navigation menu" aria-expanded="false"
                    aria-controls="nav-links">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </nav>
        </div>
    </header>

    <section class="page-content">
        <div class="container">
            <h1 data-i18n="contact.h1">Contact Us</h1>
            <div class="contact-wrapper">
                <div class="contact-info">
                    <p><strong data-i18n="contact.addressLabel">📍 Address:</strong> <span data-i18n="contact.addressValue">Tbilisi, Georgia</span></p>
                    <p><strong data-i18n="contact.phoneLabel">📞 Phone:</strong> <span data-i18n="contact.phoneValue">+995 599 33 44 17</span></p>
                    <p><strong data-i18n="contact.emailLabel">✉️ Email:</strong> <span data-i18n="contact.emailValue">hcdgroupge@gmail.com</span></p>
                    <p><strong data-i18n="contact.hoursLabel">🕐 Hours:</strong> <span data-i18n="contact.hoursValue">Mon–Fri, 9am – 6pm</span></p>
                </div>
                <form class="contact-form" id="contactForm" action="https://formsubmit.co/hcdgroupge@gmail.com" method="POST">
                    <input type="hidden" name="_subject" value="New message from your website" />
                    <input type="hidden" name="_captcha" value="false" />
                    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />
                    <input type="text" name="name" placeholder="Your Name" data-i18n-placeholder="contact.form.name" required />
                    <input type="email" name="email" placeholder="Your Email" data-i18n-placeholder="contact.form.email" required />
                    <input type="text" name="subject" placeholder="Subject" data-i18n-placeholder="contact.form.subject" />
                    <textarea name="message" placeholder="Your Message..." data-i18n-placeholder="contact.form.message" rows="5" required></textarea>
                    <button type="submit" class="btn" data-i18n="contact.form.submit">Send Message</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p data-i18n="footer.text">© 2026 Human Capital Development Group. All rights reserved.</p>
        </div>
    </footer>

    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>

</html>
